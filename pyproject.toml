[project]
name = "d-geolib-plus"
version = "0.4.1"
description = "GEOLib+ components"
readme = "README.rst"
requires-python = ">=3.12"
license = "LGPL-3.0-or-later"
authors = [
    { name = "Maarten Pronk", email = "git@evetion.nl" },
    { name = "Deltares" },
]
dependencies = [
    "pydantic>=2.0",
    "pyproj>=3.7.2",
    "pandas>=2.1.3,<3",
    "tqdm>=4.66.1",
    "scipy>=1.17.0",
    "lxml>=6.0.2",
    "numpy>=2.2.0",
    "matplotlib>=3.8.1",
    "pyshp>=2.3.1,<3",
    "more-itertools>=10.1.0",
    "netCDF4>=1.6.5",
    "requests>=2.26",
    "d-geolib>=2.9.1",
    "shapely>=2.0.2",
    "seaborn>=0.13.0",
    "folium>=0.14",
]

[project.optional-dependencies]
dev = [
    "teamcity-messages>=1.32",
    "pytest>=8.0",
    "coverage>=7.0",
    "pytest-cov>=5.0",
    "isort>=5.10.1",
    "black>=24.0",
    "mypy>=1.8",
]
docs = [
    "sphinx>=7.0",
    "sphinxcontrib-bibtex>=2.5.0",
    "sphinx-math-dollar>=1.2.1",
    "releases>=2.1",
    "rst2pdf>=0.101",
    "folium>=0.14",
]

[project.urls]
Homepage = "https://deltares.github.io/geolib-plus/"
Documentation = "https://deltares.github.io/geolib-plus/"
Repository = "https://github.com/Deltares/geolib-plus"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geolib_plus*"]

[tool.setuptools.package-data]
geolib_plus = ["**/resources/*"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
markers = [
    "unittest",
    "integrationtest",
    "systemtest",
    "acceptancetest",
    "workinprogress",
    "integration"
]

[tool.black]
line-length = 90
target-version = ['py312', 'py313', 'py314']

[isort]
multi_line_output=3
include_trailing_comma=true
force_grid_wrap=0
use_parentheses=true
line_length=90
profile = "black"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.4.1"
tag-format = "$major.$minor.$patch$prerelease"
version_files = [
    "pyproject.toml:^version",
    "tests/test_geolib_plus.py:^version",
    "geolib_plus/__init__.py:__version__",
]
annotated_tag = true
