name: ci-docs

on:
  push:
    branches:
    - master

jobs:
  Docs:
    strategy:
        fail-fast: false
        matrix:
          python-version: ["3.12"]
          os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --locked --no-build --no-install-project --extra docs

      - name: Build sphinx documentation
        run: |
          cd docs
          uv run --frozen --no-sync --no-build python -m sphinx . build -b html -c .
      - name: Commit documentation changes
        run: |
          git clone https://github.com/Deltares/geolib-plus.git --branch gh-pages --single-branch gh-pages
          rm -r -f gh-pages/dev
          mkdir gh-pages/dev
          cp -r docs/build/* gh-pages/dev
          cd gh-pages
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update dev version documentation" -a || true
          # The above command will fail if no changes were present, so we ignore
          # the return code.
          
      - name: Push changes
        uses: ad-m/github-push-action@7fba72704ad2db819788db8f2d9e7d1dfbebe089 # master
        with:
          branch: gh-pages
          directory: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
